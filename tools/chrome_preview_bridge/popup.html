<!doctype html><html lang="th"><meta charset="utf-8"><style>
:root{--bg:#fff;--fg:#1d1d1f;--mut:#6b6b70;--line:#e3e3e8;--card:#f6f6f8;--ok:#1a7f37;--bad:#c62828;--acc:#2f5bd3}
@media (prefers-color-scheme:dark){:root{--bg:#1e1e20;--fg:#ececf0;--mut:#a0a0a8;--line:#38383c;--card:#29292c;--ok:#4cc26a;--bad:#ff6b6b;--acc:#7aa2ff}}
body{font:13px system-ui;width:340px;padding:10px 12px;margin:0;background:var(--bg);color:var(--fg)}
#top{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;line-height:1.6;white-space:pre-wrap}
.ok{color:var(--ok)}.bad{color:var(--bad)}
h3{font-size:13px;margin:12px 0 4px;color:var(--mut);font-weight:600}
button{padding:8px;width:100%;margin:3px 0;cursor:pointer;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);font:inherit;text-align:left}
button:hover:not(:disabled){border-color:var(--acc)}button:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:6px}.row button{text-align:center}
p{white-space:pre-wrap;margin:2px 0 6px;font-size:12px;color:var(--mut)}
</style>
<div id="top">กำลังเชื่อมโปรแกรมในเครื่อง...</div>
<h3>1. เริ่มแชตใหม่ (คัดลอกแล้ววางเอง)</h3>
<button id="copy-new">คัดลอก Prompt เริ่มเรื่องใหม่</button>
<button id="copy-continue">คัดลอก Prompt ทำงานต่อ (ทุกเรื่อง ทำต่อเฉพาะที่ยังไม่เสร็จ)</button>
<p id="copystatus" role="status"></p>
<h3>2. ติดตามงาน (ส่งข้อความเตือนทุก 30 วินาทีจนถึงเป้า)</h3>
<p id="goalstatus">กำลังอ่านสถานะ</p>
<div class="row"><button id="goalresume">เริ่มติดตาม</button><button id="goalpause">พัก</button></div>
<h3>3. Sleep Mode (ทำเรื่องที่เปิดอยู่จนจบเอง)</h3>
<p id="sleep-status">กำลังอ่านสถานะ</p>
<div class="row"><button id="sleep-start" disabled>เริ่มทำงาน</button><button id="sleep-pause" disabled>หยุด</button></div>
<script src="config.local.js"></script><script src="popup.js"></script><script src="sleep_popup.js"></script></html>
